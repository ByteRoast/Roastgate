# Builds the Docker image and publishes it to the GitHub Container Registry:
#   push on dev                                  -> ghcr.io/byteroast/roastgate:dev
#   tag v*                                       -> ghcr.io/byteroast/roastgate:<tag>
#   pull request from dev merged into main       -> ghcr.io/byteroast/roastgate:latest
name: docker

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [main]

env:
  IMAGE: ghcr.io/byteroast/roastgate

jobs:
  publish:
    name: Build and publish the image
    runs-on: ubuntu-latest
    # A push on dev always publishes; a pull request only when it was merged and came from dev.
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          # For a merged pull request, build exactly the commit that landed on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        
      - name: Compute the image tags
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ env.IMAGE }}
            flavor: latest=false
            tags: |
              type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
              type=raw,value=latest,enable=${{ github.event_name == 'pull_request' }}
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
