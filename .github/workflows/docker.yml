# Builds the Docker image and publishes it to ghcr.io/byteroast/roastgate:
#   push on dev                              -> :dev
#   push of a release tag vX.Y.Z             -> :X.Y.Z and :latest
#   push of a pre-release tag vX.Y.Z-alpha.1 -> :X.Y.Z-alpha.1 (latest does not move)
#   push on main                             -> nothing
name: docker

on:
  push:
    branches: [ dev ]
    tags: [ 'v*' ]

env:
  IMAGE: ghcr.io/byteroast/roastgate

jobs:
  build:
    strategy:
      matrix:
        runner: [ ubuntu-26.04, ubuntu-26.04-arm ]
      fail-fast: true

    runs-on: ${{ matrix.runner }}
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ runner.arch }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ runner.arch }}

      - name: Create digests
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      packages: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}

      - name: Create manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
